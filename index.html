<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iBlue Uganda - Buy & Sell Everything</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/Swiper/9.2.0/swiper-bundle.min.css">
    <style>
        /* Alibaba-inspired styling with blue theme */
        :root {
            --primary: #2563EB;
            --primary-dark: #1D4ED8;
            --primary-light: #3B82F6;
            --secondary: #10B981;
            --danger: #EF4444;
            --warning: #F59E0B;
            --dark: #1F2937;
            --gray-700: #374151;
            --gray-600: #4B5563;
            --gray-500: #6B7280;
            --gray-400: #9CA3AF;
            --gray-300: #D1D5DB;
            --gray-200: #E5E7EB;
            --gray-100: #F3F4F6;
            --white: #FFFFFF;
            --shadow: 0 2px 8px rgba(0,0,0,0.08);
            --shadow-lg: 0 4px 16px rgba(0,0,0,0.12);
            --radius: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--gray-100);
            color: var(--dark);
            line-height: 1.4;
            padding-bottom: 70px;
        }

        /* Header with scroll behavior */
        .header {
            position: sticky;
            top: 0;
            background: var(--white);
            z-index: 1000;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            transform: translateY(0);
        }

        .header.scrolled {
            box-shadow: var(--shadow);
        }

        .header.hidden {
            transform: translateY(-100%);
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border-bottom: 1px solid var(--gray-200);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 20px;
            color: var(--primary);
            text-decoration: none;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 18px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .header-actions a {
            color: var(--gray-600);
            text-decoration: none;
            font-size: 20px;
            position: relative;
        }

        .badge {
            position: absolute;
            top: -6px;
            right: -8px;
            background: var(--danger);
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 10px;
            min-width: 16px;
            text-align: center;
        }

        /* Search */
        .search-container {
            padding: 8px 16px 12px;
        }

        .search-wrapper {
            display: flex;
            align-items: center;
            background: var(--gray-100);
            border: 1px solid var(--gray-300);
            border-radius: 24px;
            overflow: hidden;
            transition: all 0.2s;
        }

        .search-wrapper:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
        }

        .search-icon {
            padding: 0 12px;
            color: var(--gray-400);
            font-size: 16px;
        }

        .search-input {
            flex: 1;
            padding: 12px 0;
            border: none;
            background: transparent;
            font-size: 15px;
            outline: none;
        }

        .search-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 20px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            height: 44px;
        }

        /* Location Bar */
        .location-bar {
            display: flex;
            align-items: center;
            padding: 8px 16px;
            background: var(--white);
            border-bottom: 1px solid var(--gray-200);
            font-size: 14px;
            color: var(--gray-600);
            gap: 8px;
            cursor: pointer;
        }

        .location-btn {
            display: flex;
            align-items: center;
            gap: 4px;
            background: none;
            border: none;
            color: var(--primary);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            padding: 4px 8px;
        }

        /* Location Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: var(--radius);
            width: 90%;
            max-width: 400px;
            max-height: 80vh;
            overflow-y: auto;
            padding: 20px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--gray-200);
        }

        .modal-title {
            font-size: 18px;
            font-weight: 600;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--gray-500);
        }

        .region-list {
            list-style: none;
        }

        .region-item {
            padding: 12px 16px;
            border-bottom: 1px solid var(--gray-100);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .region-item:hover {
            background: var(--gray-100);
        }

        .region-item i {
            color: var(--primary);
            width: 20px;
        }

        .region-name {
            flex: 1;
        }

        .region-check {
            color: var(--primary);
        }

        .current-location {
            padding: 12px 16px;
            background: var(--gray-100);
            border-radius: var(--radius);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .current-location i {
            color: var(--primary);
        }

        /* Banner */
        .swiper {
            height: 160px;
            margin: 12px 16px;
            border-radius: var(--radius);
            overflow: hidden;
        }

        .swiper-slide {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 18px;
        }

        /* Section Headers */
        .section {
            padding: 16px;
            background: var(--white);
            margin-bottom: 8px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--dark);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title i {
            color: var(--primary);
        }

        .section-link {
            color: var(--primary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }

        /* Horizontal Scroll Products */
        .horizontal-scroll {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            margin: 0 -16px;
            padding: 4px 16px;
            scroll-behavior: smooth;
        }

        .horizontal-scroll::-webkit-scrollbar {
            display: none;
        }

        .scroll-wrapper {
            display: flex;
            gap: 12px;
        }

        .product-card-horizontal {
            flex: 0 0 160px;
            background: var(--white);
            border: 1px solid var(--gray-200);
            border-radius: var(--radius);
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s;
        }

        .product-card-horizontal:active {
            transform: scale(0.98);
        }

        .product-image {
            width: 160px;
            height: 160px;
            background: var(--gray-100);
            position: relative;
            overflow: hidden;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }

        .product-card-horizontal:hover .product-image img {
            transform: scale(1.05);
        }

        .product-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background: var(--danger);
            color: white;
            font-size: 10px;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 600;
            z-index: 2;
        }

        .product-badge.verified {
            background: var(--secondary);
        }

        .product-badge.featured {
            background: var(--warning);
            color: var(--dark);
        }

        .product-info {
            padding: 10px;
        }

        .product-title {
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .product-price {
            font-size: 16px;
            font-weight: 700;
            color: var(--danger);
            margin-bottom: 2px;
        }

        .product-price small {
            font-size: 11px;
            font-weight: 400;
            color: var(--gray-500);
        }

        .product-meta {
            font-size: 11px;
            color: var(--gray-500);
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 4px 0;
        }

        .verified-badge {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            background: #EFF6FF;
            color: var(--primary);
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            margin-top: 4px;
        }

        .verified-badge i {
            font-size: 10px;
        }

        /* Conducive Category Sections */
        .conducive-section {
            padding: 16px;
            background: var(--white);
            margin-bottom: 8px;
        }

        .conducive-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .conducive-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .conducive-icon {
            width: 48px;
            height: 48px;
            background: var(--gray-100);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: var(--primary);
        }

        .conducive-text h3 {
            font-size: 16px;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 4px;
        }

        .conducive-text p {
            font-size: 13px;
            color: var(--gray-500);
        }

        .conducive-link {
            color: var(--primary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }

        .conducive-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        /* Grid Products */
        .product-card {
            background: var(--white);
            border: 1px solid var(--gray-200);
            border-radius: var(--radius);
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .product-card:active {
            transform: scale(0.98);
        }

        .product-card .product-image {
            width: 100%;
            height: 140px;
        }

        .product-card .product-info {
            padding: 12px;
        }

        .product-card .product-title {
            font-size: 14px;
            white-space: normal;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            height: 36px;
            margin-bottom: 6px;
        }

        .product-card .product-price {
            font-size: 16px;
        }

        /* Meta Categories Menu */
        .meta-categories {
            background: var(--white);
            padding: 12px 16px;
            border-bottom: 1px solid var(--gray-200);
            display: flex;
            gap: 16px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .meta-categories::-webkit-scrollbar {
            display: none;
        }

        .meta-category-btn {
            background: var(--gray-100);
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            color: var(--gray-600);
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            text-decoration: none;
        }

        .meta-category-btn i {
            color: var(--primary);
        }

        .meta-category-btn.active {
            background: var(--primary);
            color: white;
        }

        .meta-category-btn.active i {
            color: white;
        }

        /* Deals Banner */
        .deals-banner {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            padding: 16px 20px;
            margin: 8px 16px;
            border-radius: var(--radius);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .deals-banner h3 {
            font-size: 16px;
            font-weight: 600;
        }

        .deals-banner p {
            font-size: 13px;
            opacity: 0.9;
        }

        .deals-banner button {
            background: white;
            color: var(--primary);
            border: none;
            padding: 8px 20px;
            border-radius: 24px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--white);
            border-top: 1px solid var(--gray-200);
            display: flex;
            padding: 8px 0 12px;
            z-index: 1000;
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--gray-400);
            font-size: 11px;
            gap: 4px;
        }

        .nav-item i {
            font-size: 20px;
        }

        .nav-item.active {
            color: var(--primary);
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 80px;
            left: 16px;
            right: 16px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 12px 20px;
            border-radius: 30px;
            font-size: 14px;
            text-align: center;
            z-index: 2000;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        /* Loading Skeleton */
        .skeleton {
            background: linear-gradient(90deg, var(--gray-200) 25%, var(--gray-100) 50%, var(--gray-200) 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .skeleton-image {
            width: 100%;
            height: 140px;
            background: var(--gray-200);
        }

        .skeleton-text {
            height: 16px;
            background: var(--gray-200);
            margin: 8px;
            border-radius: 4px;
        }

        .skeleton-circle {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--gray-200);
        }

        /* Responsive */
        @media (min-width: 640px) {
            .products-grid,
            .conducive-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 16px;
            }
            
            .product-card .product-image {
                height: 180px;
            }
        }

        @media (min-width: 1024px) {
            .products-grid,
            .conducive-grid {
                grid-template-columns: repeat(6, 1fr);
                gap: 20px;
            }
            
            .main-content {
                max-width: 1200px;
                margin: 0 auto;
            }
        }
    </style>
</head>

    <nav class="bottom-nav">

        <a href="help-support.html" class="nav-item">

        const ugandaRegions = [

        function initLocationSelector() {
            const locationBtn = document.getElementById('locationBtn');
            const locationBar = document.getElementById('locationBar');
            const modal = document.getElementById('locationModal');

            const currentLocationBtn = document.getElementById('useCurrentLocation');

                li.className = 'region-item';
                li.innerHTML = `
                    <i class="fas fa-map-marker-alt"></i>
                    <span class="region-name">${region.region}</span>
                    <i class="fas fa-chevron-right" style="color: var(--gray-400);"></i>
                `;
                li.addEventListener('click', () => showDistricts(region.region, region.districts));
                regionList.appendChild(li);
            });

            // Open modal
            const openModal = () => modal.classList.add('show');
            locationBar.addEventListener('click', openModal);
            locationBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                openModal();
            });

            // Close modal
            closeBtn.addEventListener('click', () => modal.classList.remove('show'));
            modal.addEventListener('click', (e) => {
                if (e.target === modal) modal.classList.remove('show');
            });

            // Use current location (simulated)
            currentLocationBtn.addEventListener('click', () => {
                showToast('Getting your location...');
                setTimeout(() => {
                    selectedRegion = 'Central';
                    selectedDistrict = 'Kampala';
                    localStorage.setItem('selectedRegion', selectedRegion);
                    localStorage.setItem('selectedDistrict', selectedDistrict);
                    currentLocationSpan.textContent = `${selectedDistrict}, ${selectedRegion}`;
                    modal.classList.remove('show');
                    showToast('Location updated to Kampala');
                    
                    // Reload products with new location filter
                    loadConduciveSections();
                    loadMetaCategory('featured');
                }, 1500);
            });
        }

        function showDistricts(region, districts) {
            const modalContent = document.querySelector('.modal-content');
            const originalContent = modalContent.innerHTML;
            
            modalContent.innerHTML = `
                <div class="modal-header">
                    <h3 class="modal-title">Select District in ${region}</h3>
                    <button class="modal-close" id="backBtn">&larr;</button>
                </div>
                <ul class="region-list" id="districtList">
                    ${districts.map(district => `
                        <li class="region-item" data-district="${district}" data-region="${region}">
                            <i class="fas fa-map-pin"></i>
                            <span class="region-name">${district}</span>
                        </li>
                    `).join('')}
                </ul>
            `;

            document.getElementById('backBtn').addEventListener('click', () => {
                modalContent.innerHTML = originalContent;
                initLocationSelector(); // Reinitialize
            });

            document.querySelectorAll('#districtList .region-item').forEach(item => {
                item.addEventListener('click', () => {
                    const district = item.dataset.district;
                    const region = item.dataset.region;
                    selectedRegion = region;
                    selectedDistrict = district;
                    localStorage.setItem('selectedRegion', region);
                    localStorage.setItem('selectedDistrict', district);
                    document.getElementById('currentLocation').textContent = `${district}, ${region}`;
                    document.getElementById('locationModal').classList.remove('show');
                    showToast(`Location set to ${district}, ${region}`);
                    
                    // Reload products with new location filter
                    loadConduciveSections();
                    loadMetaCategory('featured');
                });
            });
        }

        // ============================================
        // LOAD META CATEGORIES FROM SPOTLIGHT
        // ============================================
        async function loadMetaCategories() {
            const container = document.getElementById('metaCategories');
            
            try {
                // Get active spotlight types from homepage_spotlights
                const { data: spotlights, error } = await sb
                    .from('homepage_spotlights')
                    .select('spotlight_type')
                    .eq('is_active', true)
                    .gt('ends_at', new Date().toISOString())
                    .order('display_order', { ascending: true });
                
                if (error) throw error;
                
                // Define meta category details
                const metaCategoryMap = {
                    'featured_deals': { icon: 'fa-star', name: 'Featured Deals', param: 'featured' },
                    'trending_now': { icon: 'fa-fire', name: 'Trending Now', param: 'trending' },
                    'new_arrivals': { icon: 'fa-clock', name: 'New Arrivals', param: 'new' },
                    'budget_finds': { icon: 'fa-wallet', name: 'Budget Finds', param: 'budget' },
                    'editor_picks': { icon: 'fa-pen', name: 'Editor Picks', param: 'editor' },
                    'premium_listings': { icon: 'fa-crown', name: 'Premium', param: 'premium' },
                    'local_favorites': { icon: 'fa-heart', name: 'Local Favorites', param: 'local' },
                    'verified_sellers': { icon: 'fa-check-circle', name: 'Verified Sellers', param: 'verified' }
                };
                
                let metaButtons = '';
                
                if (spotlights && spotlights.length > 0) {
                    spotlights.forEach(spot => {
                        const meta = metaCategoryMap[spot.spotlight_type];
                        if (meta) {
                            metaButtons += `
                                <a href="spotlight.html?type=${encodeURIComponent(spot.spotlight_type)}" class="meta-category-btn" onclick="loadMetaCategory('${meta.param}'); event.preventDefault();">
                                    <i class="fas ${meta.icon}"></i> ${meta.name}
                                </a>
                            `;
                        }
                    });
                }
                
                // Add default meta categories if none in spotlight
                if (metaButtons === '') {
                    metaButtons = `
                        <a href="search-results.html?featured=true" class="meta-category-btn active" onclick="loadMetaCategory('featured'); event.preventDefault();">
                            <i class="fas fa-star"></i> Featured Deals
                        </a>
                        <a href="search-results.html?sort=trending" class="meta-category-btn" onclick="loadMetaCategory('trending'); event.preventDefault();">
                            <i class="fas fa-fire"></i> Trending Now
                        </a>
                        <a href="search-results.html?sort=newest" class="meta-category-btn" onclick="loadMetaCategory('new'); event.preventDefault();">
                            <i class="fas fa-clock"></i> New Arrivals
                        </a>
                        <a href="search-results.html?maxPrice=500000" class="meta-category-btn" onclick="loadMetaCategory('budget'); event.preventDefault();">
                            <i class="fas fa-wallet"></i> Budget Finds
                        </a>
                    `;
                }
                
                container.innerHTML = metaButtons;
                
            } catch (error) {
                console.error('Error loading meta categories:', error);
                // Fallback to default
                container.innerHTML = `
                    <a href="search-results.html?featured=true" class="meta-category-btn active" onclick="loadMetaCategory('featured'); event.preventDefault();">
                        <i class="fas fa-star"></i> Featured Deals
                    </a>
                    <a href="search-results.html?sort=trending" class="meta-category-btn" onclick="loadMetaCategory('trending'); event.preventDefault();">
                        <i class="fas fa-fire"></i> Trending Now
                    </a>
                    <a href="search-results.html?sort=newest" class="meta-category-btn" onclick="loadMetaCategory('new'); event.preventDefault();">
                        <i class="fas fa-clock"></i> New Arrivals
                    </a>
                    <a href="search-results.html?maxPrice=500000" class="meta-category-btn" onclick="loadMetaCategory('budget'); event.preventDefault();">
                        <i class="fas fa-wallet"></i> Budget Finds
                    </a>
                `;
            }
        }

        // ============================================
        // LOAD META CATEGORY PRODUCTS
        // ============================================
        async function loadMetaCategory(type) {
            const title = document.getElementById('metaCategoryTitle');
            const link = document.getElementById('metaCategoryLink');
            const wrapper = document.getElementById('metaCategoryWrapper');
            
            // Update active button
            document.querySelectorAll('.meta-category-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            if (event && event.target) {
                event.target.classList.add('active');
            }
            
            wrapper.innerHTML = getPlaceholderHorizontal();
            
            try {
                let query = sb
                    .from('ads')
                    .select(`
                        id,
                        title,
                        price,
                        currency,
                        is_negotiable,
                        image_urls,
                        view_count,
                        region,
                        district,
                        seller_id,
                        is_featured,
                        profiles!ads_seller_id_fkey (is_verified),
                        category:categories!ads_category_id_fkey (name)
                    `)
                    .eq('status', 'active');
                
                // Apply location filter
                if (selectedDistrict && selectedDistrict !== 'All') {
                    query = query.eq('district', selectedDistrict);
                }
                
                // Apply different filters based on type
                switch(type) {
                    case 'featured':
                        title.innerHTML = '⭐ Featured Deals';
                        link.href = 'search-results.html?featured=true';
                        query = query
                            .eq('is_featured', true)
                            .order('created_at', { ascending: false });
                        break;
                    case 'trending':
                        title.innerHTML = '🔥 Trending Now';
                        link.href = 'search-results.html?sort=trending';
                        query = query
                            .order('view_count', { ascending: false })
                            .order('created_at', { ascending: false });
                        break;
                    case 'new':
                        title.innerHTML = '🆕 New Arrivals';
                        link.href = 'search-results.html?sort=newest';
                        query = query
                            .order('created_at', { ascending: false });
                        break;
                    case 'budget':
                        title.innerHTML = '💰 Budget Finds';
                        link.href = 'search-results.html?maxPrice=500000';
                        query = query
                            .lt('price', 500000)
                            .order('price', { ascending: true });
                        break;
                    case 'editor':
                        title.innerHTML = '✏️ Editor Picks';
                        link.href = 'search-results.html?editor=true';
                        query = query
                            .order('view_count', { ascending: false })
                            .limit(20);
                        break;
                    case 'premium':
                        title.innerHTML = '👑 Premium Listings';
                        link.href = 'search-results.html?premium=true';
                        query = query
                            .eq('is_featured', true)
                            .order('price', { ascending: false });
                        break;
                    case 'local':
                        title.innerHTML = '❤️ Local Favorites';
                        link.href = 'search-results.html?local=true';
                        query = query
                            .order('view_count', { ascending: false });
                        break;
                    case 'verified':
                        title.innerHTML = '✅ Verified Sellers';
                        link.href = 'search-results.html?verified=true';
                        query = query
                            .eq('profiles.is_verified', true)
                            .order('created_at', { ascending: false });
                        break;
                }
                
                const { data: ads, error } = await query.limit(10);
                
                if (error) throw error;
                
                if (ads && ads.length > 0) {
                    wrapper.innerHTML = ads.map(ad => createHorizontalCard(ad, type)).join('');
                } else {
                    wrapper.innerHTML = getEmptyHorizontal(type);
                }
                
            } catch (error) {
                console.error('Error loading meta category:', error);
                wrapper.innerHTML = getPlaceholderHorizontal();
            }
        }

        // ============================================
        // LOAD CONDUCIVE SECTIONS (Fixed relationship issue)
        // ============================================
        async function loadConduciveSections() {
            const container = document.getElementById('conduciveSections');
            container.innerHTML = getSkeletonConduciveSections(5);
            
            try {
                // First get all active categories
                const { data: categories, error: catError } = await sb
                    .from('categories')
                    .select('id, name, display_name, conducive_tagline, conducive_icon, color_hex')
                    .eq('is_active', true)
                    .order('display_order', { ascending: true })
                    .order('name', { ascending: true });
                
                if (catError) throw catError;
                
                if (!categories || categories.length === 0) {
                    container.innerHTML = getEmptyConduciveSections();
                    return;
                }
                
                // For each category, get its ads using the correct foreign key relationship
                let html = '';
                
                for (const cat of categories) {
                    const { data: ads, error: adsError } = await sb
                        .from('ads')
                        .select(`
                            id,
                            title,
                            price,
                            currency,
                            is_negotiable,
                            image_urls,
                            view_count,
                            region,
                            district,
                            created_at,
                            profiles!ads_seller_id_fkey (is_verified)
                        `)
                        .eq('status', 'active')
                        .eq('category_id', cat.id)
                        .order('created_at', { ascending: false })
                        .limit(4);
                    
                    if (adsError) {
                        console.error(`Error loading ads for category ${cat.name}:`, adsError);
                        continue;
                    }
                    
                    if (ads && ads.length > 0) {
                        const displayName = cat.display_name || `Shop ${cat.name}`;
                        const tagline = cat.conducive_tagline || `Best deals on ${cat.name}`;
                        const icon = cat.conducive_icon || 'fa-tag';
                        const color = cat.color_hex || '#2563EB';
                        
                        html += `
                            <section class="conducive-section">
                                <div class="conducive-header">
                                    <div class="conducive-title">
                                        <div class="conducive-icon" style="color: ${color}">
                                            <i class="fas ${icon}"></i>
                                        </div>
                                        <div class="conducive-text">
                                            <h3>${escapeHtml(displayName)}</h3>
                                            <p>${escapeHtml(tagline)}</p>
                                        </div>
                                    </div>
                                    <a href="category.html?category=${encodeURIComponent(cat.name)}&id=${cat.id}" class="conducive-link">See all <i class="fas fa-chevron-right"></i></a>
                                </div>
                                <div class="conducive-grid">
                                    ${ads.map(ad => createConduciveCard(ad)).join('')}
                                </div>
                            </section>
                        `;
                    }
                }
                
                if (html === '') {
                    container.innerHTML = getEmptyConduciveSections();
                } else {
                    container.innerHTML = html;
                }
                
            } catch (error) {
                console.error('Error loading conducive sections:', error);
                container.innerHTML = getErrorConduciveSections();
            }
        }

        // ============================================
        // CARD CREATORS
        // ============================================
        function createHorizontalCard(product, metaType = null) {
            const imageUrl = product.image_urls?.[0] || 'https://via.placeholder.com/160?text=No+Image';
            const price = product.price ? `UGX ${parseInt(product.price).toLocaleString()}` : 'Call for price';
            const location = product.district || product.region || 'Uganda';
            const isVerified = product.profiles?.is_verified || false;
            
            let badgeText = '';
            if (metaType === 'featured') badgeText = 'FEATURED';
            else if (metaType === 'trending') badgeText = 'TRENDING';
            else if (metaType === 'new') badgeText = 'NEW';
            else if (metaType === 'budget') badgeText = 'BUDGET';
            else if (metaType === 'premium') badgeText = 'PREMIUM';
            else if (metaType === 'verified') badgeText = 'VERIFIED';
            
            return `
                <a href="ad-detail.html?id=${product.id}" class="product-card-horizontal" onclick="trackClick(${product.id})">
                    <div class="product-image">
                        <img src="${imageUrl}" alt="${escapeHtml(product.title)}" loading="lazy"
                             onload="this.style.opacity=1" style="opacity:0; transition:opacity 0.3s"
                             onerror="this.src='https://via.placeholder.com/160?text=No+Image'">
                        ${badgeText ? `<span class="product-badge featured">${badgeText}</span>` : ''}
                    </div>
                    <div class="product-info">
                        <div class="product-title">${escapeHtml(product.title.substring(0, 30))}${product.title.length > 30 ? '...' : ''}</div>
                        <div class="product-price">${price} ${product.is_negotiable ? '<small>Neg.</small>' : ''}</div>
                        <div class="product-meta">
                            <span><i class="fas fa-map-marker-alt"></i> ${escapeHtml(location)}</span>
                            <span><i class="far fa-eye"></i> ${product.view_count || 0}</span>
                        </div>
                        ${product.category ? `
                            <div class="product-meta">
                                <span><i class="fas fa-tag"></i> ${escapeHtml(product.category.name)}</span>
                            </div>
                        ` : ''}
                        ${isVerified ? `
                            <div class="verified-badge">
                                <i class="fas fa-check-circle"></i> Verified
                            </div>
                        ` : ''}
                    </div>
                </a>
            `;
        }

        function createConduciveCard(product) {
            const imageUrl = product.image_urls?.[0] || 'https://via.placeholder.com/200?text=No+Image';
            const price = product.price ? `UGX ${parseInt(product.price).toLocaleString()}` : 'Call for price';
            
            return `
                <a href="ad-detail.html?id=${product.id}" class="product-card" onclick="trackClick(${product.id})">
                    <div class="product-image">
                        <img src="${imageUrl}" alt="${escapeHtml(product.title)}" loading="lazy"
                             onload="this.style.opacity=1" style="opacity:0; transition:opacity 0.3s"
                             onerror="this.src='https://via.placeholder.com/200?text=No+Image'">
                    </div>
                    <div class="product-info">
                        <div class="product-title">${escapeHtml(product.title.substring(0, 25))}${product.title.length > 25 ? '...' : ''}</div>
                        <div class="product-price">${price}</div>
                        <div class="product-meta">
                            <span><i class="fas fa-map-marker-alt"></i> ${escapeHtml(product.district || product.region || 'Uganda')}</span>
                        </div>
                        ${product.profiles?.is_verified ? `
                            <div class="verified-badge">
                                <i class="fas fa-check-circle"></i> Verified
                            </div>
                        ` : ''}
                    </div>
                </a>
            `;
        }

        // ============================================
        // PLACEHOLDERS & EMPTY STATES
        // ============================================
        function getPlaceholderHorizontal() {
            let html = '';
            for (let i = 0; i < 6; i++) {
                html += `
                    <div class="product-card-horizontal">
                        <div class="product-image skeleton"></div>
                        <div class="product-info">
                            <div class="skeleton-text" style="width: 90%"></div>
                            <div class="skeleton-text" style="width: 60%"></div>
                            <div class="skeleton-text" style="width: 40%"></div>
                        </div>
                    </div>
                `;
            }
            return html;
        }

        function getEmptyHorizontal(type) {
            const typeNames = {
                'featured': 'Featured Deals',
                'trending': 'Trending Now',
                'new': 'New Arrivals',
                'budget': 'Budget Finds',
                'editor': 'Editor Picks',
                'premium': 'Premium Listings',
                'local': 'Local Favorites',
                'verified': 'Verified Sellers'
            };
            
            return `
                <div style="text-align: center; padding: 40px; width: 100%;">
                    <i class="fas fa-box-open" style="font-size: 48px; color: var(--gray-400); margin-bottom: 16px;"></i>
                    <h3 style="color: var(--gray-600); margin-bottom: 8px;">No ${typeNames[type] || 'Products'} Available</h3>
                    <p style="color: var(--gray-500);">Check back later for new listings</p>
                </div>
            `;
        }

        function getSkeletonConduciveSections(count = 3) {
            let html = '';
            for (let s = 0; s < count; s++) {
                html += `
                    <section class="conducive-section">
                        <div class="conducive-header">
                            <div class="conducive-title">
                                <div class="conducive-icon skeleton-circle"></div>
                                <div class="conducive-text">
                                    <div class="skeleton-text" style="width: 200px; height: 20px;"></div>
                                    <div class="skeleton-text" style="width: 150px; height: 16px;"></div>
                                </div>
                            </div>
                            <div class="skeleton-text" style="width: 60px;"></div>
                        </div>
                        <div class="conducive-grid">
                            ${getSkeletonConducive()}
                        </div>
                    </section>
                `;
            }
            return html;
        }

        function getSkeletonConducive() {
            let html = '';
            for (let i = 0; i < 4; i++) {
                html += `
                    <div class="product-card">
                        <div class="skeleton-image"></div>
                        <div class="product-info">
                            <div class="skeleton-text" style="width: 90%"></div>
                            <div class="skeleton-text" style="width: 60%"></div>
                        </div>
                    </div>
                `;
            }
            return html;
        }

        function getEmptyConduciveSections() {
            return `
                <div class="conducive-section" style="text-align: center; padding: 40px;">
                    <i class="fas fa-box-open" style="font-size: 48px; color: var(--gray-400); margin-bottom: 16px;"></i>
                    <h3 style="color: var(--gray-600); margin-bottom: 8px;">No Products Available</h3>
                    <p style="color: var(--gray-500);">Check back later for new listings</p>
                </div>
            `;
        }

        function getErrorConduciveSections() {
            return `
                <div class="conducive-section" style="text-align: center; padding: 40px;">
                    <i class="fas fa-exclamation-circle" style="font-size: 48px; color: var(--danger); margin-bottom: 16px;"></i>
                    <h3 style="color: var(--gray-600); margin-bottom: 8px;">Error Loading Products</h3>
                    <p style="color: var(--gray-500);">Please try again later</p>
                </div>
            `;
        }

        // ============================================
        // HEADER SCROLL BEHAVIOR
        // ============================================
        function setupScrollBehavior() {
            const header = document.getElementById('mainHeader');
            
            window.addEventListener('scroll', () => {
                const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
                
                if (scrollTop > 10) {
                    header.classList.add('scrolled');
                } else {
                    header.classList.remove('scrolled');
                }
                
                if (scrollTop > lastScrollTop && scrollTop > scrollThreshold) {
                    header.classList.add('hidden');
                } else {
                    header.classList.remove('hidden');
                }
                
                lastScrollTop = scrollTop;
            });
        }

        // ============================================
        // HOME NAVIGATION
        // ============================================
        document.getElementById('homeNav').addEventListener('click', (e) => {
            e.preventDefault();
            
            // Reset meta category buttons
            document.querySelectorAll('.meta-category-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            const firstBtn = document.querySelector('.meta-category-btn');
            if (firstBtn) {
                firstBtn.classList.add('active');
            }
            
            // Reload featured deals
            loadMetaCategory('featured');
            
            // Scroll to top
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // ============================================
        // TRACK CLICK
        // ============================================
        window.trackClick = async function(adId) {
            try {
                const { data: { user } } = await sb.auth.getUser();
                
                await sb
                    .from('ad_engagement')
                    .insert({
                        ad_id: adId,
                        user_id: user?.id || null,
                        action: 'click',
                        user_agent: navigator.userAgent
                    });
                
            } catch (error) {
                console.error('Error tracking click:', error);
            }
        };

        // ============================================
        // UTILITIES
        // ============================================
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // ============================================
        // INITIALIZATION
        // ============================================
        document.addEventListener('DOMContentLoaded', async () => {
            // Initialize Swiper
            new Swiper('#bannerSwiper', {
                autoplay: { delay: 3000 },
                pagination: { el: '.swiper-pagination', clickable: true },
                loop: true,
                speed: 500
            });

            // Setup scroll behavior
            setupScrollBehavior();

            // Initialize location selector
            initLocationSelector();

            // Check authentication
            const { data: { user } } = await sb.auth.getUser();
            if (user) {
                currentUser = user;
            }

            // Load meta categories from spotlight
            await loadMetaCategories();

            // Load conducive sections (only categories with products)
            await loadConduciveSections();

            // Load initial meta category (Featured Deals)
            setTimeout(() => {
                loadMetaCategory('featured');
            }, 500);

            // Search functionality
            const searchBtn = document.getElementById('searchBtn');
            const searchInput = document.getElementById('searchInput');
            
            searchBtn.addEventListener('click', () => {
                const query = searchInput.value.trim();
                if (query) {
                    window.location.href = `search-results.html?q=${encodeURIComponent(query)}`;
                }
            });

            searchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    searchBtn.click();
                }
            });
        });
    </script>
</body>
</html>

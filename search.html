<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Search - iBlue Uganda</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --dark: #1e293b;
            --gray: #64748b;
            --light-gray: #e2e8f0;
            --white: #ffffff;
            --radius: 8px;
        }

        body {
            background: var(--white);
            min-height: 100vh;
        }

        .header {
            background: var(--white);
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--light-gray);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .back-btn {
            width: 44px;
            height: 44px;
            border: none;
            background: var(--light-gray);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--dark);
            font-size: 20px;
            cursor: pointer;
        }

        .search-container {
            flex: 1;
            display: flex;
            align-items: center;
            background: var(--light-gray);
            border-radius: 30px;
            padding: 4px 4px 4px 16px;
        }

        .search-input {
            flex: 1;
            padding: 12px 0;
            border: none;
            background: transparent;
            font-size: 16px;
            outline: none;
        }

        .search-btn {
            width: 44px;
            height: 44px;
            border: none;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        .recent-searches {
            padding: 20px 16px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .clear-all {
            color: var(--primary);
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
        }

        .recent-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid var(--light-gray);
            color: var(--dark);
            text-decoration: none;
        }

        .recent-item i {
            color: var(--gray);
            width: 20px;
        }

        .recent-item span {
            flex: 1;
        }

        .recent-item .time {
            color: var(--gray);
            font-size: 12px;
        }

        .trending-section {
            padding: 20px 16px;
            background: #f8fafc;
        }

        .trending-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .trending-tag {
            padding: 8px 16px;
            background: var(--white);
            border: 1px solid var(--light-gray);
            border-radius: 30px;
            color: var(--dark);
            text-decoration: none;
            font-size: 14px;
            transition: all 0.2s;
        }

        .trending-tag:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .categories-section {
            padding: 20px 16px;
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }

        .category-item {
            text-align: center;
            text-decoration: none;
            color: var(--dark);
            transition: transform 0.2s;
        }

        .category-item:hover {
            transform: translateY(-4px);
        }

        .category-icon {
            width: 56px;
            height: 56px;
            background: var(--light-gray);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 8px;
            color: var(--primary);
            font-size: 24px;
            transition: all 0.2s;
        }

        .category-item:hover .category-icon {
            background: var(--primary);
            color: white;
        }

        .category-name {
            font-size: 12px;
            font-weight: 500;
            line-height: 1.3;
            word-break: break-word;
        }

        .loading-spinner {
            text-align: center;
            padding: 20px;
            color: var(--gray);
            grid-column: 1 / -1;
        }

        .loading-spinner i {
            font-size: 24px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            text-align: center;
            padding: 20px;
            color: #dc2626;
            grid-column: 1 / -1;
        }

        .view-all-link {
            color: var(--primary);
            font-size: 14px;
            text-decoration: none;
            font-weight: 500;
            padding: 4px 8px;
            border-radius: 16px;
            transition: background 0.2s;
        }

        .view-all-link:hover {
            background: var(--light-gray);
        }

        .retry-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 8px;
        }

        .retry-btn:hover {
            background: var(--primary-dark);
        }
    </style>
</head>
<body>
    <header class="header">
        <button class="back-btn" onclick="window.history.back()">
            <i class="fas fa-arrow-left"></i>
        </button>
        <div class="search-container">
            <input type="text" class="search-input" id="searchInput" placeholder="Search products..." autofocus>
            <button class="search-btn" id="searchBtn">
                <i class="fas fa-search"></i>
            </button>
        </div>
    </header>

    <!-- Recent Searches -->
    <div class="recent-searches" id="recentSearches">
        <div class="section-title">
            Recent Searches
            <a href="#" class="clear-all" onclick="clearRecentSearches()">Clear All</a>
        </div>
        <div id="recentList">
            <!-- Populated by JS -->
        </div>
    </div>

    <!-- Trending Searches -->
    <div class="trending-section">
        <div class="section-title">Trending Now</div>
        <div class="trending-tags" id="trendingTags">
            <!-- Populated by JS -->
        </div>
    </div>

    <!-- Browse Categories -->
    <div class="categories-section">
        <div class="section-title">
            Browse Categories
            <a href="categories.html" class="view-all-link">
                View All <i class="fas fa-arrow-right" style="font-size: 12px; margin-left: 4px;"></i>
            </a>
        </div>
        <div class="category-grid" id="categoryGrid">
            <div class="loading-spinner">
                <i class="fas fa-circle-notch"></i>
                <p>Loading categories...</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = "https://uufhvmmgwzkxvvdbqemz.supabase.co";
        const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV1Zmh2bW1nd3preHZ2ZGJxZW16Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAzMDIzNTYsImV4cCI6MjA4NTg3ODM1Nn0.WABHx4ilFRkhPHP-y4ZC4E8Kb7PRqY-cyxI8cVS8Tyc";
        const sb = window.supabase.createClient(supabaseUrl, supabaseKey);

        document.addEventListener('DOMContentLoaded', () => {
            loadRecentSearches();
            loadCategories();
            loadTrendingSearches();
            setupSearch();
        });

        function setupSearch() {
            const searchInput = document.getElementById('searchInput');
            const searchBtn = document.getElementById('searchBtn');

            async function performSearch() {
                const query = searchInput.value.trim();
                if (query) {
                    saveRecentSearch(query);
                    await saveSearchHistory(query);
                    window.location.href = `search-results.html?query=${encodeURIComponent(query)}`;
                }
            }

            searchBtn.addEventListener('click', performSearch);
            searchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') performSearch();
            });
        }

        function loadRecentSearches() {
            const recent = JSON.parse(localStorage.getItem('recentSearches') || '[]');
            const recentList = document.getElementById('recentList');

            if (recent.length === 0) {
                recentList.innerHTML = '<p style="color: var(--gray); text-align: center; padding: 20px;">No recent searches</p>';
                return;
            }

            recentList.innerHTML = recent.slice(0, 5).map(item => `
                <a href="search-results.html?query=${encodeURIComponent(item.query)}" class="recent-item">
                    <i class="fas fa-history"></i>
                    <span>${escapeHtml(item.query)}</span>
                    <span class="time">${item.time}</span>
                </a>
            `).join('');
        }

        function saveRecentSearch(query) {
            const recent = JSON.parse(localStorage.getItem('recentSearches') || '[]');
            const now = new Date();
            const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            // Remove if already exists
            const filtered = recent.filter(item => item.query !== query);
            
            // Add to front
            filtered.unshift({ query, time: timeStr });
            
            // Keep only last 10
            const trimmed = filtered.slice(0, 10);
            
            localStorage.setItem('recentSearches', JSON.stringify(trimmed));
            loadRecentSearches(); // Refresh the list
        }

        async function saveSearchHistory(query) {
            try {
                // Get current user
                const { data: { user } } = await sb.auth.getUser();
                
                if (user) {
                    // Save to search_history table for logged-in users
                    await sb
                        .from('search_history')
                        .insert({
                            user_id: user.id,
                            query: query,
                            searched_at: new Date().toISOString()
                        });
                }
            } catch (error) {
                console.error('Error saving search history:', error);
            }
        }

        function clearRecentSearches() {
            if (confirm('Clear all recent searches?')) {
                localStorage.removeItem('recentSearches');
                loadRecentSearches();
            }
        }

        async function loadCategories() {
            const grid = document.getElementById('categoryGrid');
            
            try {
                const { data, error } = await sb
                    .from('categories')
                    .select('id, name, slug, icon, conducive_icon, color_hex')
                    .eq('is_active', true)
                    .is('parent_id', null) // Get only parent categories
                    .order('display_order', { ascending: true, nullsFirst: false })
                    .order('name', { ascending: true })
                    .limit(8);

                if (error) throw error;

                const categories = data || [];
                renderCategories(categories);
            } catch (error) {
                console.error('Error loading categories:', error);
                grid.innerHTML = `
                    <div class="error-message">
                        <i class="fas fa-exclamation-circle" style="font-size: 32px; margin-bottom: 8px;"></i>
                        <p>Failed to load categories</p>
                        <button class="retry-btn" onclick="loadCategories()">
                            <i class="fas fa-redo"></i> Retry
                        </button>
                    </div>
                `;
            }
        }

        function renderCategories(categories) {
            const grid = document.getElementById('categoryGrid');
            if (!grid) return;

            if (categories.length === 0) {
                grid.innerHTML = `
                    <div class="error-message" style="color: var(--gray);">
                        <i class="fas fa-folder-open" style="font-size: 32px; margin-bottom: 8px;"></i>
                        <p>No categories available</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = categories.map(cat => {
                // Map database icons to Font Awesome icons
                const iconMap = {
                    'electronics': 'fa-mobile-alt',
                    'fashion': 'fa-tshirt',
                    'home': 'fa-home',
                    'vehicles': 'fa-car',
                    'health': 'fa-heartbeat',
                    'agriculture': 'fa-seedling',
                    'services': 'fa-tools',
                    'pets': 'fa-dog',
                    'real-estate': 'fa-building',
                    'jobs': 'fa-briefcase',
                    'education': 'fa-graduation-cap',
                    'sports': 'fa-futbol',
                    'entertainment': 'fa-film',
                    'food': 'fa-utensils',
                    'beauty': 'fa-spa',
                    'baby': 'fa-baby',
                    'books': 'fa-book',
                    'music': 'fa-music',
                    'phone': 'fa-phone',
                    'tablet': 'fa-tablet',
                    'laptop': 'fa-laptop',
                    'camera': 'fa-camera',
                    'game': 'fa-gamepad',
                    'tool': 'fa-tools',
                    'furniture': 'fa-couch',
                    'appliance': 'fa-blender',
                    'jewelry': 'fa-gem',
                    'watch': 'fa-clock',
                    'shoe': 'fa-shoe-prints',
                    'bag': 'fa-bag-shopping',
                    'toy': 'fa-puzzle-piece',
                    'grocery': 'fa-apple-alt',
                    'drink': 'fa-mug-hot',
                    'pet': 'fa-paw',
                    'plant': 'fa-seedling',
                    'ticket': 'fa-ticket-alt',
                    'gift': 'fa-gift'
                };

                // Use conducive_icon if available, otherwise fallback to icon, or default
                const iconName = cat.conducive_icon || cat.icon || 'tag';
                // Clean the icon name - remove any existing 'fa-' prefix
                const cleanIconName = iconName.replace(/^fa-/, '');
                // Get mapped icon or use the cleaned name
                const iconClass = iconMap[cleanIconName] || `fa-${cleanIconName}`;
                
                // Ensure the icon class starts with 'fa-'
                const finalIconClass = iconClass.startsWith('fa-') ? iconClass : `fa-${iconClass}`;

                return `
                    <a href="category.html?id=${cat.id}" class="category-item">
                        <div class="category-icon" ${cat.color_hex ? `style="color: ${cat.color_hex};"` : ''}>
                            <i class="fas ${finalIconClass}"></i>
                        </div>
                        <div class="category-name">${escapeHtml(cat.name)}</div>
                    </a>
                `;
            }).join('');
        }

        async function loadTrendingSearches() {
            try {
                // Get trending searches from search_history (last 30 days)
                const thirtyDaysAgo = new Date();
                thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);

                const { data, error } = await sb
                    .from('search_history')
                    .select('query, count')
                    .gte('searched_at', thirtyDaysAgo.toISOString())
                    .order('count', { ascending: false })
                    .limit(6);

                if (error) throw error;

                const trendingTags = document.getElementById('trendingTags');
                
                if (data && data.length > 0) {
                    trendingTags.innerHTML = data.map(item => `
                        <a href="search-results.html?query=${encodeURIComponent(item.query)}" class="trending-tag">
                            🔥 ${escapeHtml(item.query)}
                        </a>
                    `).join('');
                } else {
                    // Fallback trending tags
                    trendingTags.innerHTML = `
                        <a href="search-results.html?query=electronics" class="trending-tag">📱 Electronics</a>
                        <a href="search-results.html?query=fashion" class="trending-tag">👕 Fashion</a>
                        <a href="search-results.html?query=furniture" class="trending-tag">🪑 Furniture</a>
                        <a href="search-results.html?query=phones" class="trending-tag">📞 Phones</a>
                        <a href="search-results.html?query=cars" class="trending-tag">🚗 Cars</a>
                        <a href="search-results.html?query=land" class="trending-tag">🏠 Land</a>
                    `;
                }
            } catch (error) {
                console.error('Error loading trending searches:', error);
                // Fallback trending tags
                document.getElementById('trendingTags').innerHTML = `
                    <a href="search-results.html?query=electronics" class="trending-tag">📱 Electronics</a>
                    <a href="search-results.html?query=fashion" class="trending-tag">👕 Fashion</a>
                    <a href="search-results.html?query=furniture" class="trending-tag">🪑 Furniture</a>
                    <a href="search-results.html?query=phones" class="trending-tag">📞 Phones</a>
                    <a href="search-results.html?query=cars" class="trending-tag">🚗 Cars</a>
                    <a href="search-results.html?query=land" class="trending-tag">🏠 Land</a>
                `;
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Add animation styles
        const style = document.createElement('style');
        style.textContent = `
            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(10px); }
                to { opacity: 1; transform: translateY(0); }
            }
            
            .category-item {
                animation: fadeIn 0.3s ease forwards;
            }
            
            .category-item:nth-child(1) { animation-delay: 0.05s; }
            .category-item:nth-child(2) { animation-delay: 0.1s; }
            .category-item:nth-child(3) { animation-delay: 0.15s; }
            .category-item:nth-child(4) { animation-delay: 0.2s; }
            .category-item:nth-child(5) { animation-delay: 0.25s; }
            .category-item:nth-child(6) { animation-delay: 0.3s; }
            .category-item:nth-child(7) { animation-delay: 0.35s; }
            .category-item:nth-child(8) { animation-delay: 0.4s; }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>

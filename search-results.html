<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Search Results | iBlue Uganda</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }

    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --secondary: #475569;
      --success: #16a34a;
      --warning: #f59e0b;
      --danger: #dc2626;
      --light: #f8fafc;
      --dark: #1e293b;
      --gray: #64748b;
      --light-gray: #e2e8f0;
      --border: #cbd5e1;
      --radius: 8px;
      --shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      --shadow-hover: 0 8px 20px rgba(0, 0, 0, 0.12);
    }

    body {
      background-color: #f1f5f9;
      color: var(--dark);
      padding-bottom: 70px;
      min-height: 100vh;
    }

    /* Header */
    .header {
      background: white;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: var(--shadow);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn {
      background: none;
      border: none;
      color: var(--dark);
      font-size: 1.2rem;
      cursor: pointer;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .back-btn:hover {
      background: var(--light);
    }

    .header-content {
      flex: 1;
    }

    .header-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--dark);
      margin-bottom: 4px;
    }

    .search-query {
      font-size: 0.85rem;
      color: var(--gray);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .search-query i {
      font-size: 0.8rem;
    }

    /* Main Container */
    .container {
      max-width: 1500px;
      margin: 0 auto;
      padding: 16px;
    }

    /* Results Header */
    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
      background: white;
      padding: 16px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .results-count {
      font-size: 0.95rem;
      color: var(--gray);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .results-count i {
      color: var(--primary);
    }

    .sort-options {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sort-label {
      font-size: 0.85rem;
      color: var(--gray);
    }

    .sort-select {
      padding: 10px 15px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: white;
      font-size: 0.9rem;
      color: var(--dark);
      cursor: pointer;
      min-width: 160px;
    }

    .sort-select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    /* Quick Filters */
    .quick-filters {
      display: flex;
      overflow-x: auto;
      gap: 8px;
      margin-bottom: 24px;
      padding: 8px 0;
      scrollbar-width: none;
    }

    .quick-filters::-webkit-scrollbar {
      display: none;
    }

    .filter-chip {
      padding: 10px 18px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 25px;
      font-size: 0.85rem;
      color: var(--dark);
      white-space: nowrap;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .filter-chip:hover,
    .filter-chip.active {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }

    /* Featured Section */
    .featured-section {
      background: linear-gradient(to right, #fff9e6, #fff);
      border: 1px solid #ffe6b3;
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 24px;
      box-shadow: var(--shadow);
    }

    .featured-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .featured-header i {
      color: #f59e0b;
      font-size: 24px;
    }

    .featured-header h2 {
      font-size: 1.3rem;
      font-weight: 700;
      color: #b45309;
    }

    .featured-header span {
      background: #f59e0b;
      color: white;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-left: auto;
    }

    /* Ads Grid - Amazon style */
    .ads-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }

    /* Ad Card - Amazon style */
    .ad-card {
      background: white;
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: all 0.2s;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      height: 100%;
      border: 1px solid var(--border);
    }

    .ad-card:hover {
      box-shadow: var(--shadow-hover);
      transform: translateY(-2px);
      border-color: var(--primary);
    }

    .ad-image {
      position: relative;
      padding-top: 75%;
      overflow: hidden;
      background: #f8fafc;
    }

    .ad-image img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      transition: transform 0.3s;
      padding: 8px;
    }

    .ad-card:hover .ad-image img {
      transform: scale(1.05);
    }

    .ad-badges {
      position: absolute;
      top: 8px;
      left: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 2;
    }

    .badge {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 600;
      color: white;
      text-transform: uppercase;
    }

    .badge-featured {
      background: var(--warning);
      color: #000;
    }

    .badge-negotiable {
      background: var(--success);
    }

    .badge-urgent {
      background: var(--danger);
    }

    .badge-verified {
      background: var(--success);
    }

    .ad-info {
      padding: 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .ad-title {
      font-size: 1rem;
      font-weight: 500;
      line-height: 1.4;
      margin-bottom: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      color: #0f1111;
    }

    .ad-rating {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 8px;
    }

    .stars {
      color: #ffa41c;
      font-size: 0.8rem;
    }

    .reviews-count {
      color: var(--gray);
      font-size: 0.8rem;
    }

    .ad-price {
      font-size: 1.3rem;
      font-weight: 700;
      color: #b12704;
      margin-bottom: 4px;
    }

    .ad-price small {
      font-size: 0.8rem;
      font-weight: 400;
      color: var(--gray);
    }

    .ad-shipping {
      font-size: 0.8rem;
      color: var(--success);
      margin-bottom: 8px;
    }

    .ad-meta {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: auto;
      font-size: 0.8rem;
      color: var(--gray);
    }

    .ad-location,
    .ad-time,
    .ad-category {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .ad-actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid var(--light-gray);
    }

    .action-btn {
      flex: 1;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
      background: white;
    }

    .btn-chat {
      background: var(--primary);
      color: white;
      border: none;
    }

    .btn-chat:hover {
      background: var(--primary-dark);
    }

    .btn-save {
      background: white;
      color: var(--dark);
    }

    .btn-save:hover {
      background: var(--light);
    }

    .btn-save.saved {
      background: var(--danger);
      color: white;
      border-color: var(--danger);
    }

    /* Loading States */
    .loading-skeleton {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }

    .skeleton-card {
      background: white;
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .skeleton-image {
      width: 100%;
      padding-top: 75%;
      background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
      background-size: 200% 100%;
      animation: loading 1.5s infinite;
    }

    .skeleton-line {
      height: 16px;
      margin: 12px 16px 8px;
      background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
      background-size: 200% 100%;
      animation: loading 1.5s infinite;
      border-radius: 4px;
    }

    .skeleton-line.short {
      width: 60%;
    }

    .skeleton-line.medium {
      width: 80%;
    }

    @keyframes loading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .load-more-trigger {
      height: 20px;
      margin: 20px 0;
      text-align: center;
    }

    .load-more-spinner {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 3px solid var(--light-gray);
      border-radius: 50%;
      border-top-color: var(--primary);
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      background: white;
      border-radius: var(--radius);
      margin-top: 20px;
      box-shadow: var(--shadow);
    }

    .empty-state i {
      font-size: 3rem;
      color: var(--light-gray);
      margin-bottom: 20px;
    }

    .empty-state h3 {
      font-size: 1.3rem;
      margin-bottom: 10px;
      color: var(--dark);
    }

    .empty-state p {
      color: var(--gray);
      margin-bottom: 25px;
      line-height: 1.5;
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      padding: 12px 28px;
      border: none;
      border-radius: 30px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: white;
      color: var(--primary);
      padding: 12px 28px;
      border: 1px solid var(--primary);
      border-radius: 30px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s;
      margin-left: 12px;
    }

    .btn-secondary:hover {
      background: var(--light);
    }

    /* Alert */
    .alert {
      padding: 12px 16px;
      border-radius: var(--radius);
      margin-bottom: 16px;
      font-size: 0.9rem;
      display: none;
      align-items: center;
      gap: 8px;
      background: #fee2e2;
      color: var(--danger);
      border-left: 4px solid var(--danger);
    }

    .alert.show {
      display: flex;
    }

    /* Filter Panel */
    .filter-panel {
      background: white;
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 24px;
      box-shadow: var(--shadow);
    }

    .filter-title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 12px;
    }

    .filter-group {
      flex: 1;
      min-width: 150px;
    }

    .filter-label {
      font-size: 0.85rem;
      color: var(--gray);
      margin-bottom: 4px;
      display: block;
    }

    .filter-input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 0.9rem;
    }

    .filter-input:focus {
      outline: none;
      border-color: var(--primary);
    }

    .filter-actions {
      display: flex;
      gap: 12px;
      margin-top: 16px;
    }

    .filter-apply {
      background: var(--primary);
      color: white;
      padding: 8px 24px;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
    }

    .filter-reset {
      background: white;
      color: var(--gray);
      padding: 8px 24px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
    }

    /* Bottom Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 12px 0;
      z-index: 1000;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: var(--gray);
      font-size: 0.8rem;
      gap: 4px;
      transition: all 0.3s;
    }

    .nav-item.active {
      color: var(--primary);
    }

    .nav-icon {
      font-size: 1.2rem;
    }

    /* Responsive */
    @media (max-width: 640px) {
      .ads-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }
      
      .results-header {
        flex-direction: column;
        align-items: flex-start;
      }
      
      .sort-options {
        width: 100%;
      }
      
      .sort-select {
        flex: 1;
      }
      
      .container {
        padding: 12px;
      }
      
      .ad-image {
        padding-top: 100%;
      }
      
      .ad-title {
        font-size: 0.9rem;
      }
      
      .ad-price {
        font-size: 1.1rem;
      }
    }

    @media (min-width: 1024px) {
      .ads-grid {
        grid-template-columns: repeat(4, 1fr);
      }
      
      .bottom-nav {
        display: none;
      }
      
      body {
        padding-bottom: 0;
      }
    }

    @media (min-width: 1280px) {
      .ads-grid {
        grid-template-columns: repeat(5, 1fr);
      }
    }

    @media (min-width: 1536px) {
      .ads-grid {
        grid-template-columns: repeat(6, 1fr);
      }
    }

    /* Category Tag */
    .category-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      background: var(--light);
      border-radius: 15px;
      font-size: 0.7rem;
      color: var(--dark);
      margin-bottom: 8px;
    }

    .category-tag i {
      color: var(--primary);
      font-size: 0.7rem;
    }

    /* Prime Badge */
    .prime-badge {
      color: #00a8e1;
      font-size: 0.8rem;
      margin-left: 4px;
    }

    /* Deal badge */
    .deal-badge {
      background: #cc0c39;
      color: white;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 700;
      display: inline-block;
      margin-right: 4px;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <button class="back-btn" onclick="goBack()">
      <i class="fas fa-arrow-left"></i>
    </button>
    <div class="header-content">
      <div class="header-title">Search Results</div>
      <div class="search-query" id="searchQuery">
        <i class="fas fa-search"></i>
        <span id="queryText">Loading...</span>
      </div>
    </div>
    <button class="back-btn" onclick="refreshSearch()" title="Refresh results">
      <i class="fas fa-redo"></i>
    </button>
  </header>

  <!-- Main Container -->
  <div class="container">
    <!-- Alert -->
    <div class="alert" id="alertMessage">
      <i class="fas fa-exclamation-circle"></i>
      <span id="alertText"></span>
    </div>

    <!-- Results Header -->
    <div class="results-header">
      <div class="results-count" id="resultsCount">
        <i class="fas fa-search"></i>
        <span id="countText">Searching...</span>
      </div>
      <div class="sort-options">
        <span class="sort-label">Sort by:</span>
        <select class="sort-select" id="sortSelect">
          <option value="relevance">Relevance</option>
          <option value="newest">Newest First</option>
          <option value="price_low">Price: Low to High</option>
          <option value="price_high">Price: High to Low</option>
          <option value="featured">Featured First</option>
        </select>
      </div>
    </div>

    <!-- Quick Filters -->
    <div class="quick-filters" id="quickFilters">
      <!-- Filter chips will be populated dynamically -->
    </div>

    <!-- Advanced Filter Panel (Collapsible) -->
    <div class="filter-panel" id="filterPanel">
      <div class="filter-title" onclick="toggleFilters()" style="cursor: pointer;">
        <i class="fas fa-sliders-h"></i> Filters
        <i class="fas fa-chevron-down" id="filterChevron" style="margin-left: auto;"></i>
      </div>
      <div id="filterContent" style="display: none;">
        <div class="filter-row">
          <div class="filter-group">
            <label class="filter-label">Min Price (UGX)</label>
            <input type="number" class="filter-input" id="minPrice" placeholder="0">
          </div>
          <div class="filter-group">
            <label class="filter-label">Max Price (UGX)</label>
            <input type="number" class="filter-input" id="maxPrice" placeholder="Any">
          </div>
        </div>
        <div class="filter-row">
          <div class="filter-group">
            <label class="filter-label">Condition</label>
            <select class="filter-input" id="condition">
              <option value="">All</option>
              <option value="new">New</option>
              <option value="used">Used</option>
              <option value="refurbished">Refurbished</option>
            </select>
          </div>
          <div class="filter-group">
            <label class="filter-label">Region</label>
            <select class="filter-input" id="region">
              <option value="">All Uganda</option>
              <option value="Central">Central</option>
              <option value="Western">Western</option>
              <option value="Eastern">Eastern</option>
              <option value="Northern">Northern</option>
            </select>
          </div>
        </div>
        <div class="filter-actions">
          <button class="filter-apply" onclick="applyAdvancedFilters()">Apply</button>
          <button class="filter-reset" onclick="resetAdvancedFilters()">Reset</button>
        </div>
      </div>
    </div>

    <!-- Featured Section (Shown first) -->
    <div class="featured-section" id="featuredSection">
      <div class="featured-header">
        <i class="fas fa-star"></i>
        <h2>Featured Deals</h2>
        <span>Sponsored</span>
      </div>
      <div class="ads-grid" id="featuredGrid">
        <!-- Featured products load here -->
      </div>
    </div>

    <!-- Regular Results -->
    <div class="results-section" id="resultsSection">
      <div class="section-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h3>All Results</h3>
        <span id="resultCount"></span>
      </div>
      <div class="ads-grid" id="resultsGrid">
        <!-- Results load here in phases -->
      </div>
    </div>

    <!-- Loading Skeleton for initial load -->
    <div class="loading-skeleton" id="loadingSkeleton" style="display: none;">
      <!-- Generated by JS -->
    </div>

    <!-- Load More Trigger (Intersection Observer target) -->
    <div class="load-more-trigger" id="loadMoreTrigger">
      <div class="load-more-spinner" id="loadMoreSpinner" style="display: none;"></div>
    </div>

    <!-- Empty State -->
    <div class="empty-state" id="emptyState" style="display: none;">
      <i class="fas fa-search"></i>
      <h3>No Matching Ads Found</h3>
      <p>We couldn't find any ads matching your search. Try adjusting your search terms or browse our categories.</p>
      <div>
        <button class="btn-primary" onclick="window.location.href='categories.html'">
          <i class="fas fa-th-large"></i>
          Browse Categories
        </button>
        <button class="btn-secondary" onclick="window.location.href='post-ad.html'">
          <i class="fas fa-plus"></i>
          Post Your Own Ad
        </button>
      </div>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <i class="fas fa-home nav-icon"></i>
      <span>Home</span>
    </a>
    <a href="search.html" class="nav-item active">
      <i class="fas fa-search nav-icon"></i>
      <span>Search</span>
    </a>
    <a href="categories.html" class="nav-item">
      <i class="fas fa-th-large nav-icon"></i>
      <span>Categories</span>
    </a>
    <a href="saved.html" class="nav-item">
      <i class="fas fa-heart nav-icon"></i>
      <span>Saved</span>
    </a>
    <a href="profile.html" class="nav-item">
      <i class="fas fa-user nav-icon"></i>
      <span>Profile</span>
    </a>
  </nav>

  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ============================================
    // SUPABASE CONFIGURATION
    // ============================================
    const supabaseUrl = "https://uufhvmmgwzkxvvdbqemz.supabase.co";
    const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV1Zmh2bW1nd3preHZ2ZGJxZW16Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAzMDIzNTYsImV4cCI6MjA4NTg3ODM1Nn0.WABHx4ilFRkhPHP-y4ZC4E8Kb7PRqY-cyxI8cVS8Tyc";
    const sb = window.supabase.createClient(supabaseUrl, supabaseKey);

    // ============================================
    // STATE MANAGEMENT
    // ============================================
    let searchQuery = '';
    let allResults = []; // All matching results
    let featuredResults = []; // Featured results only
    let regularResults = []; // Non-featured results
    let displayedCount = 0; // How many regular results have been displayed
    const BATCH_SIZE = 6; // Load 6 items at a time
    let savedAdsCache = new Set();
    let currentSort = 'relevance';
    let isLoading = false;
    let hasMore = true;
    let currentFilters = {
      category: null,
      condition: null,
      minPrice: null,
      maxPrice: null,
      region: null,
      negotiable: false
    };

    // Intersection Observer for infinite scroll
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting && !isLoading && hasMore) {
          loadMoreResults();
        }
      });
    }, { threshold: 0.1, rootMargin: '100px' });

    // ============================================
    // INITIALIZATION
    // ============================================
    document.addEventListener('DOMContentLoaded', async function() {
      searchQuery = getQueryFromUrl();
      document.getElementById('queryText').textContent = `"${searchQuery}"`;
      
      if (!searchQuery || searchQuery.trim() === '') {
        showAlert('Please enter a search term', 'error');
        setTimeout(() => window.location.href = 'index.html', 2000);
        return;
      }

      // Show skeleton loading
      showLoadingSkeleton(12); // Show 12 skeleton cards initially
      
      await loadSearchResults();
      await loadSavedAdsCache();
      populateQuickFilters();
      
      // Set up sort change listener
      document.getElementById('sortSelect').addEventListener('change', function() {
        currentSort = this.value;
        sortAndRenderAll();
      });
      
      // Start observing load more trigger
      observer.observe(document.getElementById('loadMoreTrigger'));
    });

    // ============================================
    // LOAD SEARCH RESULTS
    // ============================================
    async function loadSearchResults() {
      try {
        const searchTerm = searchQuery.trim().toLowerCase();
        
        // Build query for all active ads
        let query = sb
          .from('ads')
          .select(`
            *,
            category:categories!ads_category_id_fkey(id, name, slug, icon),
            profiles!ads_seller_id_fkey(full_name, phone, avatar_url, is_verified)
          `)
          .eq('status', 'active');
        
        // Add search conditions
        if (searchTerm) {
          query = query.or(`title.ilike.%${searchTerm}%,description.ilike.%${searchTerm}%,specific_location.ilike.%${searchTerm}%`);
        }
        
        // Get all results (limit to 100 for performance)
        const { data: ads, error } = await query.order('created_at', { ascending: false }).limit(100);
        
        if (error) throw error;
        
        // Split into featured and regular
        allResults = ads || [];
        featuredResults = allResults.filter(ad => ad.is_featured === true);
        regularResults = allResults.filter(ad => ad.is_featured !== true);
        
        // Update counts
        updateResultsCount();
        
        // Render featured section
        renderFeaturedResults();
        
        // Reset pagination
        displayedCount = 0;
        hasMore = regularResults.length > 0;
        
        // Load first batch of regular results
        loadMoreResults();
        
        // Hide skeleton
        hideLoadingSkeleton();
        
      } catch (error) {
        console.error('Search error:', error);
        showAlert('Error searching ads. Please try again.', 'error');
        hideLoadingSkeleton();
      }
    }

    // ============================================
    // RENDER FEATURED RESULTS
    // ============================================
    function renderFeaturedResults() {
      const featuredGrid = document.getElementById('featuredGrid');
      const featuredSection = document.getElementById('featuredSection');
      
      if (featuredResults.length === 0) {
        featuredSection.style.display = 'none';
        return;
      }
      
      featuredSection.style.display = 'block';
      featuredGrid.innerHTML = '';
      
      // Show only top 6 featured results
      const topFeatured = featuredResults.slice(0, 6);
      topFeatured.forEach(ad => {
        const adCard = createAdCard(ad, true);
        featuredGrid.appendChild(adCard);
      });
    }

    // ============================================
    // LOAD MORE RESULTS (BATCH OF 6)
    // ============================================
    function loadMoreResults() {
      if (isLoading || !hasMore) return;
      
      isLoading = true;
      document.getElementById('loadMoreSpinner').style.display = 'inline-block';
      
      // Simulate network delay for smooth loading (remove in production)
      setTimeout(() => {
        const resultsGrid = document.getElementById('resultsGrid');
        const nextBatch = regularResults.slice(displayedCount, displayedCount + BATCH_SIZE);
        
        if (nextBatch.length === 0) {
          hasMore = false;
          document.getElementById('loadMoreSpinner').style.display = 'none';
          isLoading = false;
          return;
        }
        
        // Render the batch
        nextBatch.forEach(ad => {
          const adCard = createAdCard(ad, false);
          resultsGrid.appendChild(adCard);
        });
        
        displayedCount += nextBatch.length;
        hasMore = displayedCount < regularResults.length;
        
        document.getElementById('loadMoreSpinner').style.display = 'none';
        isLoading = false;
        
        // Update result count
        document.getElementById('resultCount').textContent = 
          `Showing ${displayedCount} of ${regularResults.length} results`;
        
      }, 300); // Small delay for smooth UX
    }

    // ============================================
    // CREATE AD CARD (Amazon Style)
    // ============================================
    function createAdCard(ad, isFeatured = false) {
      const card = document.createElement('a');
      card.className = 'ad-card';
      card.href = `ad-detail.html?id=${ad.id}`;
      
      // Format price
      const formattedPrice = formatPrice(ad.price);
      
      // Get first image
      let imageUrl = 'https://images.unsplash.com/photo-1583394838336-acd977736f90?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80';
      if (ad.image_urls && ad.image_urls.length > 0 && ad.image_urls[0]) {
        imageUrl = ad.image_urls[0];
      }
      
      // Time ago
      const timeAgo = getTimeAgo(new Date(ad.created_at));
      
      // Check if ad is saved
      const isSaved = savedAdsCache.has(ad.id.toString());
      
      // Badges
      let badgesHTML = '';
      if (isFeatured) {
        badgesHTML += '<div class="badge badge-featured">FEATURED</div>';
      }
      if (ad.is_negotiable) {
        badgesHTML += '<div class="badge badge-negotiable">Negotiable</div>';
      }
      // Check if ad is urgent (boosted)
      const isUrgent = ad.boost_until && new Date(ad.boost_until) > new Date();
      if (isUrgent) {
        badgesHTML += '<div class="badge badge-urgent">URGENT</div>';
      }
      // Verified seller badge
      if (ad.profiles?.is_verified) {
        badgesHTML += '<div class="badge badge-verified">VERIFIED</div>';
      }
      
      // Random rating (simulated for Amazon-like feel)
      const rating = (Math.random() * 2 + 3).toFixed(1); // 3.0-5.0
      const reviews = Math.floor(Math.random() * 100) + 10;
      
      // Random shipping (simulated)
      const hasFreeShipping = Math.random() > 0.5;
      
      card.innerHTML = `
        <div class="ad-image">
          <img src="${imageUrl}" 
               alt="${ad.title}"
               loading="lazy"
               onerror="this.src='https://images.unsplash.com/photo-1583394838336-acd977736f90?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80'">
          ${badgesHTML ? `<div class="ad-badges">${badgesHTML}</div>` : ''}
        </div>
        
        <div class="ad-info">
          <div class="ad-title">${escapeHtml(ad.title)}</div>
          
          <div class="ad-rating">
            <span class="stars">
              ${'★'.repeat(Math.floor(rating))}${rating % 1 ? '½' : ''}
            </span>
            <span class="reviews-count">(${reviews})</span>
          </div>
          
          <div class="ad-price">
            ${formattedPrice}
            ${ad.price && ad.price > 100000 ? '<small>with 2-year warranty</small>' : ''}
          </div>
          
          ${hasFreeShipping ? '<div class="ad-shipping">FREE Shipping</div>' : ''}
          
          <div class="ad-meta">
            <div class="ad-location">
              <i class="fas fa-map-marker-alt"></i>
              ${ad.district || ad.region || 'Uganda'}
            </div>
            <div class="ad-time">
              <i class="far fa-clock"></i>
              ${timeAgo}
            </div>
            ${ad.category ? `
              <div class="ad-category">
                <i class="fas fa-tag"></i>
                ${ad.category.name}
              </div>
            ` : ''}
          </div>
          
          <div class="ad-actions">
            <button class="action-btn btn-chat" onclick="event.preventDefault(); startChat(${ad.id})">
              <i class="fas fa-comment"></i> Chat
            </button>
            <button class="action-btn btn-save ${isSaved ? 'saved' : ''}" onclick="event.preventDefault(); saveAd(${ad.id}, this)">
              <i class="${isSaved ? 'fas' : 'far'} fa-heart"></i> ${isSaved ? 'Saved' : 'Save'}
            </button>
          </div>
        </div>
      `;
      
      return card;
    }

    // ============================================
    // SHOW LOADING SKELETON
    // ============================================
    function showLoadingSkeleton(count = 12) {
      const skeleton = document.getElementById('loadingSkeleton');
      const featuredGrid = document.getElementById('featuredGrid');
      const resultsGrid = document.getElementById('resultsGrid');
      
      skeleton.style.display = 'grid';
      featuredGrid.innerHTML = '';
      resultsGrid.innerHTML = '';
      
      let skeletonHTML = '';
      for (let i = 0; i < count; i++) {
        skeletonHTML += `
          <div class="skeleton-card">
            <div class="skeleton-image"></div>
            <div class="skeleton-line"></div>
            <div class="skeleton-line short"></div>
            <div class="skeleton-line medium"></div>
            <div class="skeleton-line short" style="width: 40%;"></div>
          </div>
        `;
      }
      
      skeleton.innerHTML = skeletonHTML;
    }

    function hideLoadingSkeleton() {
      document.getElementById('loadingSkeleton').style.display = 'none';
    }

    // ============================================
    // SORT AND RENDER ALL
    // ============================================
    function sortAndRenderAll() {
      // Sort all results based on current sort
      let sortedAll = [...allResults];
      
      switch (currentSort) {
        case 'newest':
          sortedAll.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
          break;
        case 'price_low':
          sortedAll.sort((a, b) => (a.price || 0) - (b.price || 0));
          break;
        case 'price_high':
          sortedAll.sort((a, b) => (b.price || 0) - (a.price || 0));
          break;
        case 'featured':
          sortedAll.sort((a, b) => {
            if (a.is_featured && !b.is_featured) return -1;
            if (!a.is_featured && b.is_featured) return 1;
            return new Date(b.created_at) - new Date(a.created_at);
          });
          break;
        default: // relevance
          // Keep original order (already sorted by relevance)
          break;
      }
      
      // Re-split into featured and regular
      featuredResults = sortedAll.filter(ad => ad.is_featured === true);
      regularResults = sortedAll.filter(ad => ad.is_featured !== true);
      
      // Re-render
      renderFeaturedResults();
      
      // Reset pagination
      displayedCount = 0;
      document.getElementById('resultsGrid').innerHTML = '';
      hasMore = regularResults.length > 0;
      loadMoreResults();
    }

    // ============================================
    // FILTER FUNCTIONS
    // ============================================
    function applyAdvancedFilters() {
      const minPrice = document.getElementById('minPrice').value;
      const maxPrice = document.getElementById('maxPrice').value;
      const condition = document.getElementById('condition').value;
      const region = document.getElementById('region').value;
      
      currentFilters = {
        minPrice: minPrice ? parseInt(minPrice) : null,
        maxPrice: maxPrice ? parseInt(maxPrice) : null,
        condition: condition || null,
        region: region || null
      };
      
      // Filter allResults
      let filtered = allResults.filter(ad => {
        if (currentFilters.minPrice && (ad.price || 0) < currentFilters.minPrice) return false;
        if (currentFilters.maxPrice && (ad.price || 0) > currentFilters.maxPrice) return false;
        if (currentFilters.condition && ad.condition !== currentFilters.condition) return false;
        if (currentFilters.region && ad.region !== currentFilters.region) return false;
        return true;
      });
      
      // Update results
      allResults = filtered;
      featuredResults = allResults.filter(ad => ad.is_featured === true);
      regularResults = allResults.filter(ad => ad.is_featured !== true);
      
      renderFeaturedResults();
      
      displayedCount = 0;
      document.getElementById('resultsGrid').innerHTML = '';
      hasMore = regularResults.length > 0;
      loadMoreResults();
      
      updateResultsCount();
      document.getElementById('filterContent').style.display = 'none';
    }

    function resetAdvancedFilters() {
      document.getElementById('minPrice').value = '';
      document.getElementById('maxPrice').value = '';
      document.getElementById('condition').value = '';
      document.getElementById('region').value = '';
      
      // Reload original results
      loadSearchResults();
    }

    function toggleFilters() {
      const content = document.getElementById('filterContent');
      const chevron = document.getElementById('filterChevron');
      
      if (content.style.display === 'none') {
        content.style.display = 'block';
        chevron.className = 'fas fa-chevron-up';
      } else {
        content.style.display = 'none';
        chevron.className = 'fas fa-chevron-down';
      }
    }

    // ============================================
    // UPDATE RESULTS COUNT
    // ============================================
    function updateResultsCount() {
      const countText = document.getElementById('countText');
      const totalCount = allResults.length;
      
      countText.textContent = `${totalCount} result${totalCount !== 1 ? 's' : ''} for "${searchQuery}"`;
      
      const emptyState = document.getElementById('emptyState');
      
      if (totalCount === 0) {
        emptyState.style.display = 'block';
        document.getElementById('featuredSection').style.display = 'none';
        document.getElementById('resultsSection').style.display = 'none';
      } else {
        emptyState.style.display = 'none';
        document.getElementById('resultsSection').style.display = 'block';
      }
    }

    // ============================================
    // POPULATE QUICK FILTERS
    // ============================================
    function populateQuickFilters() {
      const quickFilters = document.getElementById('quickFilters');
      quickFilters.innerHTML = '';
      
      // Get unique categories from results
      const categories = [...new Set(allResults.map(ad => ad.category?.name).filter(Boolean))];
      
      // Add "All" filter
      const allFilter = document.createElement('button');
      allFilter.className = 'filter-chip active';
      allFilter.innerHTML = '<i class="fas fa-filter"></i> All';
      allFilter.onclick = function() {
        document.querySelectorAll('.filter-chip').forEach(chip => chip.classList.remove('active'));
        this.classList.add('active');
        // Reset all filters
        resetAdvancedFilters();
      };
      quickFilters.appendChild(allFilter);
      
      // Add category filters
      categories.slice(0, 8).forEach(category => {
        const chip = document.createElement('button');
        chip.className = 'filter-chip';
        chip.innerHTML = `<i class="fas fa-tag"></i> ${category}`;
        chip.onclick = function() {
          document.querySelectorAll('.filter-chip').forEach(chip => chip.classList.remove('active'));
          this.classList.add('active');
          // Apply category filter
          currentFilters.category = category;
          filterByCategory(category);
        };
        quickFilters.appendChild(chip);
      });
    }

    function filterByCategory(category) {
      const filtered = allResults.filter(ad => ad.category?.name === category);
      allResults = filtered;
      featuredResults = allResults.filter(ad => ad.is_featured === true);
      regularResults = allResults.filter(ad => ad.is_featured !== true);
      
      renderFeaturedResults();
      
      displayedCount = 0;
      document.getElementById('resultsGrid').innerHTML = '';
      hasMore = regularResults.length > 0;
      loadMoreResults();
      
      updateResultsCount();
    }

    // ============================================
    // LOAD SAVED ADS CACHE
    // ============================================
    async function loadSavedAdsCache() {
      try {
        const { data: { user } } = await sb.auth.getUser();
        if (!user) return;
        
        const { data: savedAds, error } = await sb
          .from('saved_ads')
          .select('ad_id')
          .eq('user_id', user.id);
        
        if (error) throw error;
        
        savedAdsCache = new Set((savedAds || []).map(sa => sa.ad_id.toString()));
        
      } catch (error) {
        console.error('Error loading saved ads cache:', error);
      }
    }

    // ============================================
    // ACTION FUNCTIONS
    // ============================================
    async function startChat(adId) {
      try {
        const { data: { user } } = await sb.auth.getUser();
        if (!user) {
          window.location.href = 'login.html?redirect=' + encodeURIComponent(window.location.href);
          return;
        }
        window.location.href = `chat.html?ad=${adId}`;
      } catch (error) {
        console.error('Error starting chat:', error);
        showAlert('Please login to chat with seller', 'error');
      }
    }

    async function saveAd(adId, button) {
      try {
        const { data: { user } } = await sb.auth.getUser();
        if (!user) {
          window.location.href = 'login.html?redirect=' + encodeURIComponent(window.location.href);
          return;
        }
        
        const isSaved = savedAdsCache.has(adId.toString());
        
        if (isSaved) {
          const { error } = await sb
            .from('saved_ads')
            .delete()
            .eq('user_id', user.id)
            .eq('ad_id', adId);
          
          if (error) throw error;
          
          savedAdsCache.delete(adId.toString());
          
          button.innerHTML = '<i class="far fa-heart"></i> Save';
          button.classList.remove('saved');
          showAlert('Ad removed from favorites', 'success');
        } else {
          const { error } = await sb
            .from('saved_ads')
            .insert({
              user_id: user.id,
              ad_id: adId
            });
          
          if (error) throw error;
          
          savedAdsCache.add(adId.toString());
          
          button.innerHTML = '<i class="fas fa-heart"></i> Saved';
          button.classList.add('saved');
          showAlert('Ad saved to favorites', 'success');
        }
        
      } catch (error) {
        console.error('Error saving ad:', error);
        showAlert('Error saving ad. Please try again.', 'error');
      }
    }

    // ============================================
    // UTILITY FUNCTIONS
    // ============================================
    function getQueryFromUrl() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('query') || '';
    }

    function showAlert(message, type = 'error') {
      const alert = document.getElementById('alertMessage');
      const alertText = document.getElementById('alertText');
      
      alertText.textContent = message;
      alert.className = 'alert';
      alert.classList.add('show');
      
      if (type === 'success') {
        alert.style.background = '#dcfce7';
        alert.style.color = 'var(--success)';
        alert.style.borderLeftColor = 'var(--success)';
      }
      
      setTimeout(() => {
        alert.classList.remove('show');
      }, 3000);
    }

    function refreshSearch() {
      showAlert('Refreshing search results...', 'success');
      loadSearchResults();
    }

    function goBack() {
      window.history.back();
    }

    function formatPrice(price) {
      if (!price || price === 0) return 'Price on request';
      return new Intl.NumberFormat('en-UG', {
        style: 'currency',
        currency: 'UGX',
        minimumFractionDigits: 0
      }).format(price);
    }

    function getTimeAgo(date) {
      const seconds = Math.floor((new Date() - date) / 1000);
      
      let interval = seconds / 31536000;
      if (interval > 1) return Math.floor(interval) + "y ago";
      
      interval = seconds / 2592000;
      if (interval > 1) return Math.floor(interval) + "mo ago";
      
      interval = seconds / 86400;
      if (interval > 1) return Math.floor(interval) + "d ago";
      
      interval = seconds / 3600;
      if (interval > 1) return Math.floor(interval) + "h ago";
      
      interval = seconds / 60;
      if (interval > 1) return Math.floor(interval) + "m ago";
      
      return Math.floor(seconds) + "s ago";
    }

    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>

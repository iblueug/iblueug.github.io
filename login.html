<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover" />
  <title>iBlue Uganda • sign in</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(145deg, #e6eef5 0%, #d9e3ec 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      padding: 16px;
      background-attachment: fixed;
    }

    .card {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 2rem 1.5rem;
      border-radius: 32px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 40px -12px rgba(0, 35, 45, 0.25), 0 4px 18px rgba(0,0,0,0.05);
      border: 1px solid rgba(255,255,255,0.5);
    }

    h1 {
      font-size: 2.1rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      text-align: center;
      color: #0B4F6C;
      margin-bottom: 0.5rem;
      margin-top: 0.25rem;
      line-height: 1.1;
    }

    .brand-tag {
      text-align: center;
      font-size: 0.9rem;
      font-weight: 400;
      color: #3a6e7f;
      margin-bottom: 2rem;
      border-bottom: 1.5px solid rgba(11, 79, 108, 0.12);
      padding-bottom: 1rem;
      letter-spacing: 0.3px;
    }

    input {
      width: 100%;
      padding: 15px 18px;
      margin-bottom: 1rem;
      border-radius: 18px;
      border: 1.5px solid #e2e9f0;
      background: #ffffff;
      font-size: 1rem;
      line-height: 1.4;
      color: #0a2e3a;
      transition: border 0.15s, box-shadow 0.2s;
      appearance: none;
      -webkit-appearance: none;
    }

    input:focus {
      border-color: #0B4F6C;
      outline: 0;
      box-shadow: 0 0 0 4px rgba(11, 79, 108, 0.12);
    }

    input:-webkit-autofill {
      -webkit-box-shadow: 0 0 0 50px white inset;
      -webkit-text-fill-color: #0a2e3a;
    }

    .remember-me {
      display: flex;
      align-items: center;
      margin-bottom: 1.5rem;
      padding: 0 5px;
    }

    .remember-me input[type="checkbox"] {
      width: 20px;
      height: 20px;
      margin-right: 10px;
      margin-bottom: 0;
      accent-color: #0B4F6C;
      cursor: pointer;
    }

    .remember-me label {
      font-size: 0.95rem;
      color: #2c3e50;
      cursor: pointer;
      font-weight: 500;
      user-select: none;
    }

    button {
      width: 100%;
      padding: 15px 18px;
      border: none;
      border-radius: 30px;
      font-size: 1.06rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: 0.3px;
    }

    #loginBtn {
      background: #0B4F6C;
      color: white;
      box-shadow: 0 10px 18px -8px rgba(11, 79, 108, 0.4);
      margin-bottom: 1rem;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .google-btn {
      background: white;
      color: #2c3e50;
      border: 1.5px solid #e2e9f0;
      margin-bottom: 0.8rem;
      gap: 10px;
    }

    .google-btn:hover {
      background: #f8fafc;
    }

    .google-btn img {
      width: 20px;
      height: 20px;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    /* Links section */
    .auth-links {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1.2rem;
      font-size: 0.95rem;
      flex-wrap: wrap;
      gap: 10px;
    }

    .auth-links a {
      color: #0B4F6C;
      text-decoration: none;
      font-weight: 600;
      padding: 8px 0;
      transition: color 0.2s;
      border-bottom: 2px solid transparent;
    }

    .auth-links a:hover {
      color: #052a38;
      border-bottom-color: #0B4F6C;
    }

    .auth-links .register-link {
      background: rgba(11, 79, 108, 0.08);
      padding: 8px 16px;
      border-radius: 40px;
      font-weight: 600;
    }

    .auth-links .register-link:hover {
      background: rgba(11, 79, 108, 0.15);
      border-bottom: none;
    }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 1.5rem 0;
      color: #7a8e9e;
      font-size: 0.85rem;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid rgba(0, 0, 0, 0.1);
    }

    .divider::before {
      margin-right: 0.5rem;
    }

    .divider::after {
      margin-left: 0.5rem;
    }

    .msg {
      margin-top: 1.5rem;
      padding: 1rem;
      text-align: center;
      border-radius: 40px;
      font-size: 0.95rem;
      font-weight: 500;
      display: none;
      opacity: 0;
      transition: opacity 0.2s;
      line-height: 1.4;
    }

    .msg.show {
      display: block;
      opacity: 1;
    }

    .msg.success {
      background: #e1f7ed;
      color: #0a5c46;
      border-left: 6px solid #1e9b7a;
    }

    .msg.error {
      background: #ffe9e9;
      color: #b13e3e;
      border-left: 6px solid #c74a4a;
    }

    .msg.info {
      background: #e1f0fa;
      color: #0b4f6c;
      border-left: 6px solid #0B4F6C;
    }

    @media (max-width: 400px) {
      .card { padding: 1.75rem 1.2rem; }
      h1 { font-size: 1.9rem; }
    }

    @media (max-height: 600px) and (orientation: landscape) {
      body { padding: 12px; }
      .card { padding: 1.25rem; }
      h1 { font-size: 1.8rem; margin-bottom: 0.2rem; }
      input { padding: 12px 16px; margin-bottom: 0.6rem; }
    }

    button, input {
      -webkit-tap-highlight-color: transparent;
    }

    button:focus-visible, input:focus-visible, a:focus-visible {
      outline: 3px solid #0B4F6C;
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>iBlue</h1>
    <div class="brand-tag">Uganda • smart access</div>
    
    <input id="email" type="email" placeholder="Email address" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" />
    <input id="password" type="password" placeholder="Password" autocomplete="current-password" />
    
    <div class="remember-me">
      <input type="checkbox" id="rememberMe" checked>
      <label for="rememberMe">Keep me logged in on this device</label>
    </div>
    
    <button id="loginBtn">Sign in →</button>
    
    <div class="divider">or continue with</div>
    
    <button id="googleLoginBtn" class="google-btn">
      <img src="https://www.google.com/favicon.ico" alt="Google" style="width: 20px; height: 20px;">
      <span>Continue with Google</span>
    </button>
    
    <!-- Auth Links: Register and Forgot Password -->
    <div class="auth-links">
      <a href="forgot-password.html" class="forgot-link">Forgot password?</a>
      <a href="register.html" class="register-link">Create account →</a>
    </div>
    
    <div id="msg" class="msg" role="status"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    (function() {
      "use strict";

      // Supabase configuration
      const supabaseUrl = "https://uufhvmmgwzkxvvdbqemz.supabase.co";
      const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV1Zmh2bW1nd3preHZ2ZGJxZW16Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAzMDIzNTYsImV4cCI6MjA4NTg3ODM1Nn0.WABHx4ilFRkhPHP-y4ZC4E8Kb7PRqY-cyxI8cVS8Tyc";
      
      // Session storage keys
      const STORAGE_KEYS = {
        SAVED_EMAIL: 'iblue_saved_email',
        REMEMBER_ME: 'iblue_remember_me',
        SESSION_EXPIRY: 'iblue_session_expiry',
        INTENDED_PAGE: 'iblue_intended_page',
        PREVIOUS_PAGE: 'iblue_previous_page',
        AUTH_PERSISTENCE: 'iblue_auth_persistence'
      };

      // Allowed redirect URLs (internal pages only)
      const ALLOWED_REDIRECTS = [
        'https://iblueug.github.io/dashboard.html',
        'https://iblueug.github.io/messages.html',
        'https://iblueug.github.io/profile.html',
        'https://iblueug.github.io/chat.html',
        'https://iblueug.github.io/my-ads.html',
        'https://iblueug.github.io/post-ad.html',
        'https://iblueug.github.io/saved.html',
        'https://iblueug.github.io/index.html',
        'https://iblueug.github.io/categories.html',
        'https://iblueug.github.io/category.html',
        'https://iblueug.github.io/search-results.html',
        'https://iblueug.github.io/ad-detail.html',
        'https://iblueug.github.io/seller-profile.html',
        'https://iblueug.github.io/notifications.html',
        'https://iblueug.github.io/help-support.html'
      ];

      const DEFAULT_REDIRECT = 'https://iblueug.github.io/index.html';

      // DOM elements
      const msgEl = document.getElementById('msg');
      const loginBtn = document.getElementById('loginBtn');
      const googleBtn = document.getElementById('googleLoginBtn');
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');
      const rememberMeCheckbox = document.getElementById('rememberMe');

      // Initialize Supabase client
      let sb;

      // --- Initialize Supabase client with persistence settings ---
      function initSupabaseClient(rememberMe) {
        return supabase.createClient(supabaseUrl, supabaseKey, { 
          auth: { 
            flowType: 'pkce',
            autoRefreshToken: rememberMe,
            detectSessionInUrl: true,
            persistSession: rememberMe,
            storage: rememberMe ? localStorage : sessionStorage
          } 
        });
      }

      // Initialize with default
      sb = initSupabaseClient(true);

      // --- Message handler ---
      function showMessage(text, type = 'error') {
        if (!msgEl) return;
        msgEl.textContent = text;
        msgEl.className = 'msg show ' + type;
        
        if (type === 'success') {
          setTimeout(() => {
            msgEl.classList.remove('show');
          }, 4000);
        }
      }

      // --- Get the previous page the user came from ---
      function getPreviousPage() {
        const referrer = document.referrer;
        
        // Check if referrer is from our site
        if (referrer && referrer.includes('iblueug.github.io')) {
          // Store it for later use
          sessionStorage.setItem(STORAGE_KEYS.PREVIOUS_PAGE, referrer);
          return referrer;
        }
        
        // Check if we stored it earlier
        const storedPrevious = sessionStorage.getItem(STORAGE_KEYS.PREVIOUS_PAGE);
        if (storedPrevious) {
          return storedPrevious;
        }
        
        return null;
      }

      // --- Get intended redirect (prioritizes previous page, then redirect param, then default) ---
      function getIntendedRedirect() {
        // Priority 1: Check if we came from a page on our site
        const previousPage = getPreviousPage();
        if (previousPage && ALLOWED_REDIRECTS.some(url => previousPage.startsWith(url))) {
          // Clear it after retrieving
          sessionStorage.removeItem(STORAGE_KEYS.PREVIOUS_PAGE);
          return previousPage;
        }
        
        // Priority 2: Check for redirect parameter in URL
        const urlParams = new URLSearchParams(window.location.search);
        const urlRedirect = urlParams.get('redirect');
        
        if (urlRedirect) {
          // Handle relative paths
          let fullUrl = urlRedirect;
          if (urlRedirect.startsWith('/')) {
            fullUrl = 'https://iblueug.github.io' + urlRedirect;
          }
          
          if (ALLOWED_REDIRECTS.includes(fullUrl)) {
            return fullUrl;
          }
        }
        
        // Priority 3: Check storage for intended page
        const rememberMe = localStorage.getItem(STORAGE_KEYS.REMEMBER_ME) === 'true';
        const storage = rememberMe ? localStorage : sessionStorage;
        const storedRedirect = storage.getItem(STORAGE_KEYS.INTENDED_PAGE);
        
        if (storedRedirect && ALLOWED_REDIRECTS.includes(storedRedirect)) {
          storage.removeItem(STORAGE_KEYS.INTENDED_PAGE);
          return storedRedirect;
        }
        
        // Default to home page
        return DEFAULT_REDIRECT;
      }

      // --- Store the intended page before redirecting to login ---
      function storeIntendedPage() {
        const urlParams = new URLSearchParams(window.location.search);
        const redirect = urlParams.get('redirect');
        
        if (redirect) {
          let redirectUrl = redirect;
          if (redirect.startsWith('/')) {
            redirectUrl = 'https://iblueug.github.io' + redirect;
          }
          
          if (ALLOWED_REDIRECTS.includes(redirectUrl)) {
            const rememberMe = rememberMeCheckbox.checked;
            const storage = rememberMe ? localStorage : sessionStorage;
            storage.setItem(STORAGE_KEYS.INTENDED_PAGE, redirectUrl);
          }
        }
      }

      // --- Save preferences ---
      function savePreferences(email, rememberMe) {
        if (rememberMe) {
          localStorage.setItem(STORAGE_KEYS.SAVED_EMAIL, email);
          localStorage.setItem(STORAGE_KEYS.REMEMBER_ME, 'true');
          
          const expiryDate = new Date();
          expiryDate.setDate(expiryDate.getDate() + 30);
          localStorage.setItem(STORAGE_KEYS.SESSION_EXPIRY, expiryDate.toISOString());
        } else {
          sessionStorage.setItem(STORAGE_KEYS.SAVED_EMAIL, email);
          localStorage.setItem(STORAGE_KEYS.REMEMBER_ME, 'false');
          
          localStorage.removeItem(STORAGE_KEYS.SAVED_EMAIL);
          localStorage.removeItem(STORAGE_KEYS.SESSION_EXPIRY);
        }
      }

      // --- Load saved email ---
      function loadSavedCredentials() {
        const rememberMe = localStorage.getItem(STORAGE_KEYS.REMEMBER_ME) === 'true';
        const savedEmail = rememberMe ? 
          localStorage.getItem(STORAGE_KEYS.SAVED_EMAIL) : 
          sessionStorage.getItem(STORAGE_KEYS.SAVED_EMAIL);
        
        // Check session expiry
        if (rememberMe) {
          const expiryStr = localStorage.getItem(STORAGE_KEYS.SESSION_EXPIRY);
          if (expiryStr) {
            const expiryDate = new Date(expiryStr);
            if (new Date() > expiryDate) {
              localStorage.removeItem(STORAGE_KEYS.SAVED_EMAIL);
              localStorage.removeItem(STORAGE_KEYS.SESSION_EXPIRY);
              localStorage.setItem(STORAGE_KEYS.REMEMBER_ME, 'false');
              rememberMeCheckbox.checked = false;
              return;
            }
          }
        }
        
        if (savedEmail) {
          emailInput.value = savedEmail;
          rememberMeCheckbox.checked = rememberMe;
        }
      }

      // --- Configure session persistence ---
      function configureSessionPersistence(rememberMe) {
        sb = initSupabaseClient(rememberMe);
        localStorage.setItem(STORAGE_KEYS.AUTH_PERSISTENCE, rememberMe ? 'local' : 'session');
        
        if (!rememberMe) {
          sb.auth.signOut().catch(console.error);
          
          const keysToRemove = [];
          for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (key && (key.includes('supabase') || key.includes('sb-'))) {
              keysToRemove.push(key);
            }
          }
          keysToRemove.forEach(key => localStorage.removeItem(key));
        }
      }

      // --- Handle successful login ---
      async function handleSuccessfulLogin() {
        const redirectUrl = getIntendedRedirect();
        const destinationPage = redirectUrl.split('/').pop().replace('.html', '') || 'home';
        
        showMessage(`✓ Success! Redirecting to ${destinationPage}...`, 'success');
        
        setTimeout(() => {
          window.location.href = redirectUrl;
        }, 1000);
      }

      // --- Email/Password Login ---
      async function loginHandler(e) {
        e.preventDefault();
        
        const email = emailInput.value.trim();
        const password = passwordInput.value.trim();
        const rememberMe = rememberMeCheckbox.checked;
        
        if (!email) {
          showMessage('📧 Email is required', 'error');
          emailInput.focus();
          return;
        }
        if (!password) {
          showMessage('🔒 Password cannot be empty', 'error');
          passwordInput.focus();
          return;
        }
        if (!/^\S+@\S+\.\S+$/.test(email)) {
          showMessage('Please enter a valid email address', 'error');
          emailInput.focus();
          return;
        }

        configureSessionPersistence(rememberMe);
        savePreferences(email, rememberMe);

        loginBtn.disabled = true;
        loginBtn.textContent = 'Signing in...';

        try {
          const { data, error } = await sb.auth.signInWithPassword({ 
            email, 
            password 
          });

          if (error) {
            showMessage(error.message || 'Authentication failed', 'error');
            loginBtn.disabled = false;
            loginBtn.textContent = 'Sign in →';
            return;
          }

          if (rememberMe && data.session) {
            const expiresAt = new Date();
            expiresAt.setDate(expiresAt.getDate() + 30);
            localStorage.setItem(STORAGE_KEYS.SESSION_EXPIRY, expiresAt.toISOString());
            localStorage.setItem(STORAGE_KEYS.SAVED_EMAIL, email);
          }

          await handleSuccessfulLogin();
          
        } catch (err) {
          showMessage('Network error. Try again.', 'error');
          loginBtn.disabled = false;
          loginBtn.textContent = 'Sign in →';
        }
      }

      // --- Google Login ---
      async function googleLoginHandler() {
        const rememberMe = rememberMeCheckbox.checked;
        
        try {
          googleBtn.disabled = true;
          googleBtn.innerHTML = '<span>Connecting to Google...</span>';
          
          // Store the intended redirect before Google OAuth
          const redirectUrl = getIntendedRedirect();
          const storage = rememberMe ? localStorage : sessionStorage;
          storage.setItem(STORAGE_KEYS.INTENDED_PAGE, redirectUrl);
          
          // Configure persistence for the OAuth flow
          configureSessionPersistence(rememberMe);
          
          // Get the current page URL for the redirect
          const redirectTo = window.location.origin + '/login.html';
          
          const { data, error } = await sb.auth.signInWithOAuth({
            provider: 'google',
            options: {
              redirectTo: redirectTo,
              queryParams: {
                access_type: 'offline',
                prompt: 'consent'
              }
            }
          });

          if (error) {
            throw error;
          }

          // The OAuth redirect will happen automatically
          
        } catch (error) {
          console.error('Google login error:', error);
          showMessage(error.message || 'Failed to sign in with Google', 'error');
          googleBtn.disabled = false;
          googleBtn.innerHTML = `
            <img src="https://www.google.com/favicon.ico" alt="Google" style="width: 20px; height: 20px;">
            <span>Continue with Google</span>
          `;
        }
      }

      // --- Handle OAuth callback and session restoration ---
      async function handleOAuthCallback() {
        try {
          // Check if this is an OAuth callback
          const hashParams = new URLSearchParams(window.location.hash.substring(1));
          const accessToken = hashParams.get('access_token');
          
          if (accessToken) {
            showMessage('Completing Google sign in...', 'info');
            
            const { data, error } = await sb.auth.getSession();
            
            if (error) {
              console.error('OAuth callback error:', error);
              showMessage('Failed to complete Google sign in', 'error');
              return;
            }
            
            if (data.session) {
              // Apply remember me settings
              const rememberMe = localStorage.getItem(STORAGE_KEYS.REMEMBER_ME) === 'true';
              
              if (rememberMe) {
                const expiresAt = new Date();
                expiresAt.setDate(expiresAt.getDate() + 30);
                localStorage.setItem(STORAGE_KEYS.SESSION_EXPIRY, expiresAt.toISOString());
              }
              
              await handleSuccessfulLogin();
            }
          }
        } catch (error) {
          console.error('OAuth callback handling error:', error);
        }
      }

      // --- Check existing session ---
      async function checkExistingSession() {
        try {
          // First, handle any OAuth callback
          await handleOAuthCallback();
          
          const rememberMe = localStorage.getItem(STORAGE_KEYS.REMEMBER_ME) === 'true';
          configureSessionPersistence(rememberMe);
          
          const { data, error } = await sb.auth.getSession();
          
          if (error) {
            console.error('Session check error:', error);
            return;
          }
          
          if (data && data.session) {
            // Check session expiry for remember me
            if (rememberMe) {
              const expiryStr = localStorage.getItem(STORAGE_KEYS.SESSION_EXPIRY);
              if (expiryStr) {
                const expiryDate = new Date(expiryStr);
                if (new Date() > expiryDate) {
                  await sb.auth.signOut();
                  return;
                }
              }
            }
            
            // User is already logged in, redirect to intended page
            const redirectUrl = getIntendedRedirect();
            
            // Only redirect if we're not already on the login page with a hash
            if (!window.location.hash && window.location.pathname.includes('login')) {
              const destinationPage = redirectUrl.split('/').pop().replace('.html', '') || 'home';
              showMessage(`Already logged in! Redirecting to ${destinationPage}...`, 'info');
              
              setTimeout(() => {
                window.location.replace(redirectUrl);
              }, 1000);
            }
          }
        } catch (e) {
          console.error('Session check error:', e);
        }
      }

      // --- Setup visibility handler for session expiry ---
      function setupVisibilityHandler() {
        document.addEventListener('visibilitychange', function() {
          if (document.visibilityState === 'visible') {
            const rememberMe = localStorage.getItem(STORAGE_KEYS.REMEMBER_ME) === 'true';
            if (rememberMe) {
              const expiryStr = localStorage.getItem(STORAGE_KEYS.SESSION_EXPIRY);
              if (expiryStr) {
                const expiryDate = new Date(expiryStr);
                if (new Date() > expiryDate) {
                  localStorage.removeItem(STORAGE_KEYS.SAVED_EMAIL);
                  localStorage.removeItem(STORAGE_KEYS.SESSION_EXPIRY);
                  localStorage.setItem(STORAGE_KEYS.REMEMBER_ME, 'false');
                  showMessage('Your session has expired. Please log in again.', 'info');
                }
              }
            }
          }
        });
      }

      // --- Initialize ---
      document.addEventListener('DOMContentLoaded', () => {
        loadSavedCredentials();
        
        // Store the previous page if we came from somewhere
        getPreviousPage();
        
        // Process any redirect parameters
        setTimeout(() => {
          storeIntendedPage();
        }, 100);
        
        checkExistingSession();
        setupVisibilityHandler();
      });

      // Event listeners
      loginBtn.addEventListener('click', loginHandler);
      googleBtn.addEventListener('click', googleLoginHandler);

      emailInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          passwordInput.focus();
        }
      });
      
      passwordInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          loginHandler(e);
        }
      });

      rememberMeCheckbox.addEventListener('change', function(e) {
        configureSessionPersistence(e.target.checked);
      });

      window.addEventListener('pageshow', function() {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Sign in →';
        
        googleBtn.disabled = false;
        googleBtn.innerHTML = `
          <img src="https://www.google.com/favicon.ico" alt="Google" style="width: 20px; height: 20px;">
          <span>Continue with Google</span>
        `;
      });

    })();
  </script>
